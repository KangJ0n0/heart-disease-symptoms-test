<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnosa Gejala Penyakit Jantung</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background-color: #f9f9f9;
      }
      h2 {
        text-align: center;
      }
      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <h2>Form Diagnosa Gejala Penyakit Jantung</h2>
    <form action="/predict" method="post">
      <label for="age">Usia</label>
      <input type="number" name="age" required />

      <label for="sex">Jenis Kelamin (1 = Laki-laki, 0 = Perempuan)</label>
      <input type="number" name="sex" required />

      <label for="cp">Tipe Nyeri Dada (0-3)</label>
      <input type="number" name="cp" required />

      <label for="trestbps">Tekanan Darah Istirahat (mm Hg)</label>
      <input type="number" name="trestbps" required />

      <label for="chol">Kolesterol (mg/dl)</label>
      <input type="number" name="chol" required />

      <label for="fbs">Gula Darah > 120 mg/dl (1 = Ya, 0 = Tidak)</label>
      <input type="number" name="fbs" required />

      <label for="restecg">Hasil EKG Saat Istirahat (0-2)</label>
      <input type="number" name="restecg" required />

      <label for="thalach">Detak Jantung Maksimum</label>
      <input type="number" name="thalach" required />

      <label for="exang">Angin karena Olahraga (1 = Ya, 0 = Tidak)</label>
      <input type="number" name="exang" required />

      <label for="oldpeak">Depresi ST</label>
      <input type="number" name="oldpeak" step="any" required />

      <label for="slope">Kemiringan Segmen ST (0-2)</label>
      <input type="number" name="slope" required />

      <label for="ca">Jumlah Pembuluh Besar (0-3)</label>
      <input type="number" name="ca" required />

      <label for="thal">Thalassemia (1 = Normal, 2 = Fixed Defect, 3 = Reversable Defect)</label>
      <input type="number" name="thal" required />

      <button type="submit">Diagnosa</button>
    </form>
  </body>
</html>
